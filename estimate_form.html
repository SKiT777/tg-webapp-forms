<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка задачи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .task-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .task-info strong {
            color: #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .range-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📝 Оценка задачи</h2>
        
        <div class="task-info">
            <strong>Задача №:</strong> <span id="taskNumber"></span><br>
            <strong>Исполнитель:</strong> @<span id="userName"></span>
        </div>
        
        <form id="estimateForm">
            <div class="form-group">
                <label>Оценка трудозатрат (часы):</label>
                <div class="range-inputs">
                    <div>
                        <label style="font-size: 12px; color: #888;">От:</label>
                        <input type="number" id="estimate_from" step="0.5" min="0" required>
                    </div>
                    <div>
                        <label style="font-size: 12px; color: #888;">До:</label>
                        <input type="number" id="estimate_to" step="0.5" min="0" required>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Комментарий (необязательно):</label>
                <textarea id="comment" placeholder="Опишите особенности задачи..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">Отправить оценку</button>
        </form>
        
        <div class="message success" id="successMsg">
            ✅ Оценка успешно отправлена!<br>
            <small>Можете закрыть эту страницу</small>
        </div>
        <div class="message error" id="errorMsg"></div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskNumber = urlParams.get('task');
        const userName = urlParams.get('user');
        const token = urlParams.get('token');
        
        // ВАЖНО: замените на ваш реальный URL
       const API_URL = 'https://rdsrv.1000th.ru/our_crm_dev_ilya/hs/formhandler/submit';
        
        document.getElementById('taskNumber').textContent = taskNumber;
        document.getElementById('userName').textContent = userName;
        
        document.getElementById('estimateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const estimateFrom = parseFloat(document.getElementById('estimate_from').value);
            const estimateTo = parseFloat(document.getElementById('estimate_to').value);
            const comment = document.getElementById('comment').value.trim();
            
            if (estimateTo < estimateFrom) {
                showError('Оценка "До" не может быть меньше "От"');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';
            
            const data = {
                form_type: 'estimate',
                task_number: taskNumber,
                user_name: userName,
                token: token,
                estimate_from: estimateFrom,
                estimate_to: estimateTo,
                comment: comment
            };
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showSuccess();
                } else {
                    showError(result.error || 'Ошибка отправки');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить оценку';
                }
                
            } catch (error) {
                showError('Ошибка соединения с сервером');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить оценку';
            }
        });
        
        function showSuccess() {
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('estimateForm').style.display = 'none';
        }
        
        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '❌ ' + message;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
